############## style ##############
style:
  layout:
    max-width: 1130px #总体宽度
    post-max-width: 800px #文章内容宽度
  color:
    theme-main: "#1A98FF" # 主色调
    theme-secondary: "#DDF0FF" # 次色调
    text-main: "#333333" # 文字主色调
    text-secondary: "#898FA0" # 文字次色调
  animation:
    open: true # 如果开启动画的话会引入animation.css


########## 关于主页的设置 ##########
# home页可选类型
home:
  type: "home" # 主页的类型，可选 home | img | simple

# archive页可选类型
archive:
  type: "img" # archive的类型，可选 img | simple

categories:
  type: "img" # archive的类型，可选 img | simple

tags:
  type: "img" # archive的类型，可选 img | simple

newsroom:
  type: "img"

home_img_mode:
  default_cover:
    - https://raw.githubusercontent.com/CreatingServerW/Pic1/main/img/QQ%25E5%259B%25BE%25E7%2589%258720220416112142.png

archive_img_mode:
  default_cover: #默认的cover
    - https://mirror.ghproxy.com/https://raw.githubusercontent.com/CatalpaCute/image-hosting/main/CreatingBlog/binhai2022.jpg
# icon
icon: https://mirror.ghproxy.com/https://raw.githubusercontent.com/CatalpaCute/image-hosting/main/CreatingBlog/icon.png #标签页图标
#  header
site_name: Creating!
site_description: Create Your World! #The default meta description for all the meta descriptions
#Add description property to any page to change the meta description
menu:
  主页: /
  公告: /announcement
  NEWSROOM: /newsroom
  关于: /about


## 本地搜索
search:
  open: true # 是否开启
  page: /search # 页面路径（通常命名为search）



# 自我介绍
intro:
